[package]
name = "agent-globe"
version = "0.14.0"
edition = "2024"
description = "GPU-rendered 3D globe of coding-agent sessions, subagents and their terminal executions, live."
license = "MIT"

[lib]
name = "agent_globe"
path = "src/lib.rs"

[[bin]]
name = "agent-globe"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
bevy_egui = "0.43"
bevy_panorbit_camera = { version = "0.36", features = ["bevy_egui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
crossbeam-channel = "0.5"
tiny_http = "0.12"
anyhow = "1"
thiserror = "2"
dirs = "6"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
rodio = "0.22"
regex = "1"
winit = "0.30"
notify-rust = "4"
tray-icon = "0.26"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }


[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
